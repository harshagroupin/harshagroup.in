    <meta property="og:type" content="website" />

    <!-- Structured Data — Organization + RealEstateAgent -->
    <script type="application/ld+json">

            "url": "https://harshagroup.in/logo.png",

          }

          "url": "https://harshagroup.in",
          "name": "Harsha Group",
          "publisher": { "@id": "https://harshagroup.in/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://harshagroup.in/our-spaces?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
